<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarship Ledger · lilboreal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a1633;--navy:#0f2150;--deep:#132a63;--cobalt:#2f5bea;--sky:#7cc4ff;--cyan:#3fe0d0;--paper:#eef4ff;--line:#26407f;--mute:#8ea3cf;--warm:#ffb347;
--ok:#3ddc97;--sub:#ffc857;--no:#ff6b6b;}
*{box-sizing:border-box}html,body{margin:0}
body{overflow-x:hidden;background:var(--ink);color:var(--paper);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;
background-image:radial-gradient(circle at 1px 1px,rgba(124,196,255,.09) 1px,transparent 0);background-size:22px 22px}
a{color:var(--sky)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px}
header{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;border-bottom:2px solid var(--line);padding-bottom:18px}
h1{font:800 clamp(38px,7vw,78px)/.9 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.03em}
h1 em{font-style:normal;color:var(--sky);position:relative}
h1 em:after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.12em;background:var(--warm);transform:skew(-12deg);opacity:.9;z-index:-1}
.sub{color:var(--mute);font-size:13px;margin-top:10px}
.src{font:500 12px "IBM Plex Mono",monospace;color:var(--mute);text-align:right}
.src b{color:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:22px 0;border:2px solid var(--line);border-radius:4px;background:var(--navy)}
.stat{padding:16px 18px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.stat .v{font:800 34px/1.1 "Bricolage Grotesque";margin-top:4px}
.stat .v.won{color:var(--ok)}
.bar{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:-8px 0 26px;background:var(--deep)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute);margin-bottom:26px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
h2{font:800 22px "Bricolage Grotesque";margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
h2 small{font:500 12px "IBM Plex Mono";color:var(--mute)}
.soon{scrollbar-color:var(--line) transparent;display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:30px;scroll-snap-type:x mandatory}
.tick{flex:0 0 220px;scroll-snap-align:start;background:var(--deep);border-left:4px solid var(--sky);padding:12px 14px;border-radius:3px;text-decoration:none;color:inherit;transition:transform .15s}
.tick:hover{transform:translateY(-3px)}
.tick.hot{border-color:var(--warm)}.tick.late{border-color:var(--no);opacity:.85}
.tick .d{font:500 12px "IBM Plex Mono";color:var(--sky)}.tick.hot .d{color:var(--warm)}.tick.late .d{color:var(--no)}
.tick .n{font-weight:600;margin:4px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tick .a{font-size:12px;color:var(--mute)}
.controls{position:sticky;top:0;z-index:5;background:var(--ink);padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;background:var(--navy);color:var(--paper);border:1.5px solid var(--line);border-radius:3px;padding:8px 10px}
input:focus,select:focus{outline:none;border-color:var(--sky)}
input[type=search]{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{cursor:pointer;font-size:12px;padding:5px 10px;border:1.5px solid var(--line);border-radius:99px;background:transparent;color:var(--paper);transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--sky)}.chip.on{background:var(--cobalt);border-color:var(--cobalt)}
.chip .c{font-family:"IBM Plex Mono";color:var(--mute);margin-left:4px}.chip.on .c{color:#cfe0ff}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{font:500 11px "IBM Plex Mono";text-transform:uppercase;letter-spacing:.1em;color:var(--mute);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th.s:after{content:" ↓";color:var(--sky)}th.s.asc:after{content:" ↑"}
td{padding:11px 8px;border-bottom:1px solid rgba(38,64,127,.6);vertical-align:top}
tr.row{transition:background .12s}tr.row:hover{background:var(--navy)}
.rk{font:500 12px "IBM Plex Mono";color:var(--mute);width:34px}
.nm a{color:var(--paper);font-weight:600;text-decoration:none;background:linear-gradient(var(--sky),var(--sky)) 0 100%/0 1.5px no-repeat;transition:background-size .2s}
.nm a:hover{background-size:100% 1.5px}
.nt{font-size:12px;color:var(--mute);margin-top:3px;max-width:520px}
.amt{font:500 13px "IBM Plex Mono";max-width:150px}
.dl{font-size:13px;max-width:150px}.dl.hot{color:var(--warm);font-weight:600}.dl.late{color:var(--no)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;white-space:nowrap;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ty{font:500 10px "IBM Plex Mono";letter-spacing:.08em;color:var(--cyan)}.ty.J{color:var(--sky)}
tr.dim td{opacity:.5}
.empty{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}
thead{display:none}table,tbody,tr,td{display:block}tr.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
td{border:0;padding:0}.rk{grid-row:span 3}.nm{grid-column:2/4}.amt,.dl,.st,.ef,.tyc{font-size:12px}.ef,.efh{display:none}
header{grid-template-columns:1fr}.src{text-align:left}}
.plan{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-bottom:30px}
.box{background:var(--navy);border:2px solid var(--line);border-radius:4px;padding:16px 18px}
.box.need{border-color:var(--warm)}.box.need h2{color:var(--warm)}
.need li{margin:0 0 10px}.need li b{display:block}.need li span{font-size:12px;color:var(--mute)}
.box ul,.box ol{margin:0;padding-left:18px}
.nx{list-style:none;padding:0!important}.nx li{display:grid;grid-template-columns:86px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid rgba(38,64,127,.6);align-items:baseline}
.nx li:last-child{border:0}.nx .d{font:500 12px "IBM Plex Mono";color:var(--sky)}.nx .hot .d,.nx li.hot .d{color:var(--warm)}
.nx a{color:var(--paper);text-decoration:none;font-weight:600}.nx a:hover{color:var(--sky)}.nx .a{font-size:12px;color:var(--mute);text-align:right}
.flab{font:500 11px "IBM Plex Mono";text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-right:4px}
.chips{align-items:center}
@media(max-width:760px){.plan{grid-template-columns:1fr}.nx li{grid-template-columns:70px 1fr}.nx .a{grid-column:2;text-align:left}}
</style></head><body><div class="wrap">
<header><div><h1>Scholarship <em>Ledger</em></h1><div class="sub">Every award Shepard is chasing, straight from the tracker sheet.</div></div>
<div class="src" id="src">loading…</div></header>
<div class="stats" id="stats"></div>
<div class="plan"><div class="box need"><h2>Needs Shepard <small id="needc"></small></h2><ul id="need"></ul></div>
<div class="box"><h2>Up next by deadline <small>open items · amber = within 14 days</small></h2><ol class="nx" id="next"></ol></div></div>
<h2>Everything in the tracker</h2>
<div class="controls"><input type="search" id="q" placeholder="Search name, notes, prompt…">
<select id="sort"><option value="rank">Sort: rank</option><option value="amt">Sort: amount</option><option value="dl">Sort: deadline</option></select>
<div class="chips" id="fs"></div><div class="chips" id="ft"></div></div>
<table><thead><tr><th data-k="rank">#</th><th>Scholarship</th><th data-k="amt">Amount</th><th data-k="dl">Deadline</th><th class="efh">Effort</th><th>Status</th><th>Type</th></tr></thead><tbody id="tb"></tbody></table>
</div>
<script>
const ID="1Qg1_OmLcpjHebUBjuGl-kuIUWL4vk-TB5F4owrdcDFI";
const LIVE=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
const ST={won:["Won","var(--ok)"],sub:["Submitted","var(--sub)"],no:["Rejected","var(--no)"],ns:["Not started","var(--sky)"],off:["Dropped / ineligible","var(--mute)"]};
const $=s=>document.querySelector(s);
function csv(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);r.push(row);row=[];f=""}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r}
function status(s){s=(s||"").toLowerCase();if(/won|accept|award/.test(s))return"won";if(/denied|reject|not selected/.test(s))return"no";if(/not applied|not started/.test(s))return"ns";if(/drop|inelig|not submitted|skip|removed/.test(s))return"off";if(/submit|applied|entered/.test(s))return"sub";return"ns"}
function amount(s){const m=(s||"").match(/\$\s?[\d,]+(\.\d+)?\s*[kK]?/g);if(!m)return 0;return Math.max(...m.map(x=>{let n=parseFloat(x.replace(/[$,\s]/g,""));if(/k$/i.test(x.trim()))n*=1e3;return n||0}))}
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function date(s){s=s||"";let m=s.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/i);if(m)return new Date(+m[3],MON[m[1].toLowerCase()],+m[2]);m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[1]-1,+m[2])}return null}
function effortKey(e){e=(e||"").toLowerCase();if(!e)return"Unknown";if(/no-essay|very low/.test(e))return"Minimal";if(/^low/.test(e))return"Low";if(/short/.test(e))return"Short essay";if(/medium/.test(e))return"Medium";if(/long|high/.test(e))return"Heavy";return e}
const fmt=n=>"$"+Math.round(n).toLocaleString();
let rows=[],F={st:new Set,ty:new Set},sortK="rank",asc=true;
const today=new Date();today.setHours(0,0,0,0);
function parse(text){const r=csv(text);const h=r.shift();return r.filter(x=>(x[0]||"").trim()).map((x,i)=>{const nm=x[0].trim();const rm=nm.match(/^(\d+)\.\s*(.*)$/);const d=date(x[2]);const tr=(x[8]||"").trim().toUpperCase();const ty=tr||(/sweep/i.test(x[7]||"")?"SWEEPSTAKES":"JUDGED");return{rank:rm?+rm[1]:i+1,name:rm?rm[2]:nm,amtS:x[1]||"",amt:amount(x[1]),dlS:x[2]||"",dl:d,eff:x[3]||"",efk:effortKey(x[3]),prompt:x[4]||"",link:x[5]||"",stS:x[6]||"Not started",st:status(x[6]),notes:x[7]||"",ty,days:d?Math.round((d-today)/864e5):null}})}
function render(){
 const sub=rows.filter(r=>r.st=="sub"||r.st=="won"||r.st=="no");const won=rows.filter(r=>r.st=="won");const dec=rows.filter(r=>r.st=="won"||r.st=="no");
 $("#stats").innerHTML=[["Submitted",sub.length],["Won",won.length+(won.length?" · "+fmt(won.reduce((a,r)=>a+r.amt,0)):""),"won"],["$ applied for",fmt(sub.reduce((a,r)=>a+r.amt,0))],["In the tracker",rows.length]].map(([k,v,c])=>`<div class="stat"><div class="k">${k}</div><div class="v ${c||""}">${v}</div></div>`).join("");
 const cnt={};rows.forEach(r=>cnt[r.st]=(cnt[r.st]||0)+1);
 const open=rows.filter(r=>r.st=="ns");
 const need={};open.forEach(r=>{const t=r.stS+" "+r.notes;let k=null;
  const m=t.match(/needs shepard[:\-\s]*([^.;]*)/i);if(m)k=m[1].trim()||"Input needed";
  else if(/(parents'?|family'?s?|household'?s?)[^.;]{0,40}1040|1040[^.;]{0,30}parents/i.test(t))k="Parents' most recent 1040 (first 2 pages, SSN blacked out)";
  if(k)(need[k]=need[k]||[]).push(r)});
 const nk=Object.keys(need);$("#needc").textContent=nk.length?nk.length+" item"+(nk.length>1?"s":""):"";
 $("#need").innerHTML=nk.length?nk.map(k=>`<li><b>${esc(k)}</b><span>For: ${need[k].map(r=>esc(r.name)+(r.dl?" (due "+r.dl.toLocaleDateString("en-US",{month:"short",day:"numeric"})+")":"")).join(", ")}</span></li>`).join(""):`<li><span>Nothing right now. You're clear.</span></li>`;
 const nx=open.filter(r=>r.dl&&r.days>=0).sort((a,b)=>a.dl-b.dl).slice(0,8);
 $("#next").innerHTML=nx.length?nx.map(r=>`<li class="${r.days<=14?"hot":""}"><span class="d">${r.dl.toLocaleDateString("en-US",{month:"short",day:"numeric"})} · ${r.days==0?"today":r.days+"d"}</span>${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name)}<span class="a">${esc(r.amtS.slice(0,28))}</span></li>`).join(""):`<li>No dated open items.</li>`;
 $("#fs").innerHTML="";chips("#fs","st",Object.keys(ST).filter(k=>cnt[k]).map(k=>[k,ST[k][0],cnt[k]]));$("#fs").insertAdjacentHTML("afterbegin",'<span class="flab">Status</span>');
 const tc={};rows.forEach(r=>tc[r.ty]=(tc[r.ty]||0)+1);chips("#ft","ty",Object.keys(tc).map(k=>[k,k[0]+k.slice(1).toLowerCase(),tc[k]]));$("#ft").insertAdjacentHTML("afterbegin",'<span class="flab">Type</span>');
 table()}
function chips(sel,key,list){$(sel).innerHTML=list.map(([v,l,c])=>`<button class="chip ${F[key].has(v)?"on":""}" data-f="${key}" data-v="${esc(v)}">${esc(l)}<span class="c">${c}</span></button>`).join("")}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function table(){const q=$("#q").value.toLowerCase().trim();
 let v=rows.filter(r=>(!F.st.size||F.st.has(r.st))&&(!F.ty.size||F.ty.has(r.ty))&&(!q||(r.name+" "+r.notes+" "+r.prompt+" "+r.amtS).toLowerCase().includes(q)));
 const g={rank:r=>r.rank,amt:r=>-r.amt,dl:r=>r.dl?+r.dl:9e15}[sortK];v.sort((a,b)=>(g(a)-g(b))*(asc?1:-1));
 document.querySelectorAll("th[data-k]").forEach(t=>{t.classList.toggle("s",t.dataset.k==sortK);t.classList.toggle("asc",!asc)});
 $("#tb").innerHTML=v.length?v.map(r=>{const dc=r.dl&&r.st=="ns"?(r.days<0?"late":r.days<=14?"hot":""):"";return`<tr class="row ${r.st=="off"?"dim":""}"><td class="rk">${r.rank}</td><td class="nm">${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name)}<div class="nt">${esc(r.prompt&&r.prompt!="None"?r.prompt:r.notes).slice(0,170)}</div></td><td class="amt">${esc(r.amtS||"—")}</td><td class="dl ${dc}">${esc(r.dlS||"—")}</td><td class="ef">${esc(r.eff)}</td><td class="st"><span class="pill" style="--c:${ST[r.st][1]}" title="${esc(r.stS)}">${ST[r.st][0]}</span></td><td class="tyc"><span class="ty ${r.ty[0]}">${esc(r.ty)}</span></td></tr>`}).join(""):`<tr><td colspan=7 class="empty">No scholarships match those filters.</td></tr>`}
document.addEventListener("click",e=>{const c=e.target.closest(".chip");if(c){const s=F[c.dataset.f];s.has(c.dataset.v)?s.delete(c.dataset.v):s.add(c.dataset.v);c.classList.toggle("on");table();return}
 const t=e.target.closest("th[data-k]");if(t){if(sortK==t.dataset.k)asc=!asc;else{sortK=t.dataset.k;asc=true}$("#sort").value=sortK;table()}});
$("#q").oninput=table;$("#sort").onchange=e=>{sortK=e.target.value;asc=true;table()};
(async()=>{let t,live=false;try{const r=await fetch(LIVE+"&_="+Date.now());t=await r.text();if(!r.ok||/^\s*</.test(t))throw 0;live=true}catch(e){t=await (await fetch("data.csv?_="+Date.now())).text()}
 rows=parse(t);$("#src").innerHTML=live?`<b>● live</b> from Google Sheets<br>${new Date().toLocaleString()}`:`snapshot copy · sheet not public yet<br><a href="https://docs.google.com/spreadsheets/d/${ID}/edit" target="_blank">open sheet</a>`;render()})();
</script></body></html>
